name: Build plugin index

# 什么时候跑：
#   · 往本分支（plugin）推了插件包 / 脚本 / 工作流本身
#   · 手动触发（Actions 页「Run workflow」）
# 注意：提交回 list.json 的推送**不会**触发自己 —— list.json 不在 paths 白名单里，
# 否则会陷入「重建索引 → 提交 → 又重建」的死循环。
on:
  push:
    branches:
      - plugin
    paths:
      - "plugins/**"
      - "tools/**"
      - ".github/workflows/build-index.yml"
  workflow_dispatch:

# 提交 list.json 回本分支，需要写权限
permissions:
  contents: write

# 同一分支的多次触发排队执行，避免两个 job 同时改 list.json 撞车
concurrency:
  group: build-index-plugin
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin branch
        uses: actions/checkout@v4
        with:
          ref: plugin
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate list.json
        run: node tools/build-index.mjs --repo "${{ github.repository }}" --branch plugin

      - name: Commit list.json if changed
        run: |
          set -e
          if git diff --quiet -- list.json; then
            echo "list.json 无变化，跳过提交"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add list.json
          git commit -m "chore(plugin): 重建插件索引 [skip ci]"
          git push origin HEAD:plugin

          echo "已提交更新后的 list.json"
